dataset:
  name: PTB-XL
  version: "1.0.3"
  sampling_rate: 500
  signal_length_seconds: 10
  signal_columns: 12
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  validation_folds: [9]
  test_folds: [10]
  diagnostic_classes: [NORM, MI, STTC, CD, HYP]

preprocessing:
  bandpass_enabled: true
  lowcut_hz: 0.5
  highcut_hz: 40.0
  filter_order: 4
  normalize_per_lead: true
